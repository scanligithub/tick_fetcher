name: Daily TDX Behavior Factor Pipeline

on:
  schedule:
    - cron: '30 8 * * 1-5'  # 北京时间周一至周五下午 16:30 自动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: ⚙️ Create Directories
        run: |
          mkdir -p config src/go_fetcher/ src/engine/ src/pipeline/ data/output/ data/temp_chunks/

      - name: 📝 Write Config Files
        run: |
          cat << 'EOF' > config/settings.yaml
          concurrency: 4
          chunk_size: 500
          test_mode: false
          test_stocks: ["SZ000001", "SH600519"]
          days_to_fetch: 1
          EOF

          cat << 'EOF' > config/factor_config.yaml
          data_quality_weights:
            observed_ratio: 0.4
            coverage_ratio: 0.3
            non_empty_ratio: 0.3

          imbalance_threshold: 0.3

          limit_thresholds:
            limit_up_pct: 0.099
            limit_down_pct: -0.099

          epsilon:
            vol: 1e-5
            res: 1e-5
          EOF

          cat << 'EOF' > requirements.txt
          polars>=0.20.0
          pyarrow>=14.0.0
          requests>=2.31.0
          pyyaml>=6.0.1
          pandas>=2.0.0
          EOF

      - name: 📝 Write Go Fetcher
        run: |
          cat << 'EOF' > src/go_fetcher/go.mod
          module tick_fetcher

          go 1.24

          require github.com/injoyai/tdx v1.0.0
          EOF

          cat << 'EOF' > src/go_fetcher/fetcher.go
          package main

          import (
          	"encoding/csv"
          	"encoding/json"
          	"flag"
          	"fmt"
          	"os"
          	"strconv"
          	"strings"
          	"sync"

          	"github.com/injoyai/tdx"
          	"github.com/injoyai/tdx/protocol"
          )

          type StockMaster struct {
          	Code     string `json:"code"`
          	CodeName string `json:"code_name"`
          }

          func main() {
          	modeFlag := flag.String("mode", "fetch", "运行模式")
          	codesFlag := flag.String("codes", "", "待查询的股票代码列表")
          	dateFlag := flag.String("date", "", "查询日期")
          	outFlag := flag.String("out", "temp_ticks.csv", "导出 CSV 路径")
          	flag.Parse()

          	switch *modeFlag {
          	case "list":
          		runFetchList()
          	case "fetch":
          		runFetchTicks(*codesFlag, *dateFlag, *outFlag)
          	default:
          		fmt.Fprintf(os.Stderr, "❌ 未知运行模式\n")
          		os.Exit(1)
          	}
          }

          func runFetchList() {
          	// 使用 DialDefault 启用底层库的自动测速与最优路由选择
          	cli, err := tdx.DialDefault()
          	if err != nil {
          		fmt.Fprintf(os.Stderr, "Error: 无法通过 DialDefault 连接到任何可用的通达信服务器: %v\n", err)
          		os.Exit(2)
          	}
          	defer cli.Close()

          	var masterList []StockMaster
          	exchanges := []protocol.Exchange{protocol.ExchangeSH, protocol.ExchangeSZ, protocol.ExchangeBJ}

          	for _, ex := range exchanges {
          		resp, err := cli.GetCodeAll(ex)
          		if err != nil || resp == nil {
          			continue
          		}
          		for _, item := range resp.List {
          			if ex == protocol.ExchangeSH {
          				if strings.HasPrefix(item.Code, "60") || strings.HasPrefix(item.Code, "68") {
          					masterList = append(masterList, StockMaster{Code: "SH" + item.Code, CodeName: item.Name})
          				}
          			} else if ex == protocol.ExchangeSZ {
          				if strings.HasPrefix(item.Code, "00") || strings.HasPrefix(item.Code, "30") {
          					masterList = append(masterList, StockMaster{Code: "SZ" + item.Code, CodeName: item.Name})
          				}
          			} else if ex == protocol.ExchangeBJ {
          				if strings.HasPrefix(item.Code, "43") || strings.HasPrefix(item.Code, "83") ||
          					strings.HasPrefix(item.Code, "87") || strings.HasPrefix(item.Code, "88") ||
          					strings.HasPrefix(item.Code, "92") {
          					masterList = append(masterList, StockMaster{Code: "BJ" + item.Code, CodeName: item.Name})
          				}
          			}
          		}
          	}

          	file, _ := os.Create("stock_list.json")
          	defer file.Close()
          	json.NewEncoder(file).Encode(masterList)
          }

          func runFetchTicks(codesStr, dateStr, outPath string) {
          	rawCodes := strings.Split(codesStr, ",")
          	
          	outFile, err := os.Create(outPath)
          	if err != nil {
          		fmt.Fprintf(os.Stderr, "Error: 无法创建本地数据转储容器: %v\n", err)
          		os.Exit(3)
          	}
          	defer outFile.Close()

          	csvWriter := csv.NewWriter(outFile)
          	defer csvWriter.Flush()
          	csvWriter.Write([]string{"code", "date", "time", "price", "volume", "status", "number"})

          	var mu sync.Mutex
          	var wg sync.WaitGroup

          	jobChan := make(chan string, len(rawCodes))
          	for _, c := range rawCodes {
          		jobChan <- strings.TrimSpace(c)
          	}
          	close(jobChan)

          	concurrency := 6
          	for i := 0; i < concurrency; i++ {
          		wg.Add(1)
          		go func() {
          			defer wg.Done()
          			workerCli, err := tdx.DialDefault()
          			if err != nil {
          				return
          			}
          			defer workerCli.Close()

          			for tcode := range jobChan {
          				var allTrades protocol.Trades
          				start := 0

          				for {
          					resp, err := workerCli.GetHistoryTrade(dateStr, tcode, uint16(start), 2000)
          					if err != nil || resp == nil || len(resp.List) == 0 {
          						break
          					}
          					allTrades = append(allTrades, resp.List...)

          					if len(resp.List) < 2000 {
          						break
          					}
          					start += len(resp.List)
          					if start > 60000 {
          						break
          					}
          				}

          				if len(allTrades) == 0 {
          					continue
          				}

          				var records [][]string
          				for _, t := range allTrades {
          					timeStr := t.Time.Format("15:04:05")
          					priceRaw := fmt.Sprintf("%v", t.Price)
          					priceClean := strings.ReplaceAll(priceRaw, "元", "")
          					priceClean = strings.TrimSpace(priceClean)

          					records = append(records, []string{
          						tcode,
          						dateStr,
          						timeStr,
          						priceClean,
          						strconv.Itoa(int(t.Volume)),
          						strconv.Itoa(t.Status),
          						strconv.Itoa(t.Number),
          					})
          				}

          				mu.Lock()
          				csvWriter.WriteAll(records)
          				mu.Unlock()
          			}
          		}()
          	}
          	wg.Wait()
          }
          EOF

      - name: 📝 Write Python Engine Files
        run: |
          cat << 'EOF' > src/engine/tick_cleaner.py
          import polars as pl

          def clean_raw_ticks(file_path: str) -> pl.DataFrame:
              df = pl.read_csv(
                  file_path,
                  dtypes={
                      "code": pl.String,
                      "date": pl.String,
                      "time": pl.String,
                      "price": pl.Float64,
                      "volume": pl.Int64,
                      "status": pl.Int8,
                      "number": pl.Int32
                  }
              )
              df = df.filter(
                  (pl.col("price") > 0) & 
                  (pl.col("volume") >= 0) & 
                  (pl.col("time").str.len_chars() == 8)
              )
              df = df.with_columns(
                  pl.when(pl.col("status") == 0).then(pl.lit(0))
                  .when(pl.col("status") == 1).then(pl.lit(1))
                  .otherwise(pl.lit(2))
                  .alias("direction")
              )
              return df
          EOF

          cat << 'EOF' > src/engine/micro_binner.py
          import polars as pl
          import datetime

          def generate_standard_grid() -> pl.DataFrame:
              time_slots = []
              start = datetime.datetime.strptime("09:30:00", "%H:%M:%S")
              for i in range(120):
                  t = start + datetime.timedelta(minutes=i)
                  time_slots.append(t.strftime("%H:%M:%S"))
              start = datetime.datetime.strptime("13:00:00", "%H:%M:%S")
              for i in range(120):
                  t = start + datetime.timedelta(minutes=i)
                  time_slots.append(t.strftime("%H:%M:%S"))
              return pl.DataFrame({"minute": time_slots})

          def perform_micro_binning(ticks_df, adv_1m, atr_1m, eps_vol=1e-5, eps_res=1e-5):
              continuous_df = ticks_df.filter(
                  ((pl.col("time") >= "09:30:00") & (pl.col("time") < "11:30:00")) |
                  ((pl.col("time") >= "13:00:00") & (pl.col("time") < "15:00:00"))
              ).with_columns(
                  pl.col("time").str.slice(0, 5).add(":00").alias("minute")
              )
              if continuous_df.is_empty():
                  return pl.DataFrame()

              stock_code = continuous_df["code"][0]
              trade_date = continuous_df["date"][0]

              agg_df = continuous_df.group_by("minute").agg([
                  pl.col("price").first().alias("open"),
                  pl.col("price").max().alias("high"),
                  pl.col("price").min().alias("low"),
                  pl.col("price").last().alias("close"),
                  (pl.col("price") * pl.col("volume")).sum().alias("amount_sum"),
                  pl.col("volume").sum().alias("volume_sum"),
                  pl.col("volume").filter(pl.col("direction") == 0).sum().alias("buy_vol"),
                  pl.col("volume").filter(pl.col("direction") == 1).sum().alias("sell_vol"),
                  pl.col("volume").filter(pl.col("direction") == 2).sum().alias("neutral_vol"),
                  pl.len().alias("trade_count")
              ]).with_columns(
                  (pl.col("amount_sum") / (pl.col("volume_sum") + 1e-8)).alias("vwap")
              )

              grid_df = generate_standard_grid()
              aligned_df = grid_df.join(agg_df, on="minute", how="left")

              aligned_df = aligned_df.with_columns([
                  pl.col("volume_sum").fill_null(0).alias("volume_sum"),
                  pl.col("buy_vol").fill_null(0).alias("buy_vol"),
                  pl.col("sell_vol").fill_null(0).alias("sell_vol"),
                  pl.col("neutral_vol").fill_null(0).alias("neutral_vol"),
                  pl.col("trade_count").fill_null(0).alias("trade_count"),
                  pl.col("close").forward_fill().alias("close")
              ]).with_columns([
                  pl.col("open").fill_null(pl.col("close")).alias("open"),
                  pl.col("high").fill_null(pl.col("close")).alias("high"),
                  pl.col("low").fill_null(pl.col("close")).alias("low"),
                  pl.col("vwap").fill_null(pl.col("close")).alias("vwap"),
                  (pl.col("volume_sum") > 0).alias("has_trade")
              ]).with_columns([
                  (pl.col("has_trade") == False).alias("is_empty_bin"),
                  pl.col("has_trade").alias("price_return_valid"),
                  (pl.col("buy_vol") + pl.col("sell_vol") > 0).alias("direction_valid")
              ])

              aligned_df = aligned_df.with_columns([
                  pl.when(pl.col("has_trade")).then((pl.col("close") / pl.col("open")) - 1.0).otherwise(0.0).alias("price_return"),
                  pl.when(pl.col("has_trade")).then((pl.col("high") - pl.col("low")) / (pl.col("vwap") + 1e-8)).otherwise(0.0).alias("range")
              ]).with_columns([
                  ((pl.col("buy_vol") - pl.col("sell_vol")) / (pl.col("volume_sum") + eps_vol)).alias("imbalance"),
                  (pl.col("buy_vol") / (pl.col("volume_sum") + eps_vol)).alias("buy_ratio"),
                  (pl.col("sell_vol") / (pl.col("volume_sum") + eps_vol)).alias("sell_ratio"),
                  ((pl.col("volume_sum") - adv_1m) / (adv_1m * 0.5 + eps_vol)).alias("effort_z"),
                  (pl.col("price_return") / (atr_1m + eps_res)).alias("result_z")
              ]).with_columns([
                  (pl.col("effort_z") / (pl.col("result_z").abs() + eps_res)).alias("effort_result_ratio"),
                  pl.lit(stock_code).alias("code"),
                  pl.lit(trade_date).alias("trade_date")
              ])
              return aligned_df
          EOF

          cat << 'EOF' > src/engine/auction_features.py
          import polars as pl

          def extract_auction_features(ticks_df: pl.DataFrame, prev_close: float) -> dict:
              auction_df = ticks_df.filter(
                  (pl.col("time") >= "09:15:00") & (pl.col("time") <= "09:25:00")
              )
              if auction_df.is_empty():
                  return {
                      "auction_volume": 0.0,
                      "auction_gap": 0.0,
                      "auction_strength": 0.0,
                      "auction_stability": 1.0
                  }
              auction_volume = float(auction_df["volume"].sum())
              open_price = float(auction_df["price"].last())
              auction_gap = (open_price / prev_close - 1.0) if prev_close > 0 else 0.0
              price_std = float(auction_df["price"].std()) if len(auction_df) > 1 else 0.0
              auction_stability = 1.0 / (price_std + 1e-5)
              auction_strength = auction_volume * abs(auction_gap)
              return {
                  "auction_volume": auction_volume,
                  "auction_gap": auction_gap,
                  "auction_strength": auction_strength,
                  "auction_stability": auction_stability
              }
          EOF

          cat << 'EOF' > src/engine/limit_regime.py
          import polars as pl

          def calculate_limit_regime(ticks_df, prev_close, limit_up_pct=0.099, limit_down_pct=-0.099):
              if ticks_df.is_empty() or prev_close <= 0:
                  return {"limit_state": 0, "price_response_validity": 1.0}
              limit_up_price = round(prev_close * (1.0 + limit_up_pct), 2)
              limit_down_price = round(prev_close * (1.0 + limit_down_pct), 2)
              max_price = ticks_df["price"].max()
              min_price = ticks_df["price"].min()
              limit_state = 0
              price_response_validity = 1.0
              if max_price >= limit_up_price:
                  limit_state = 1
                  up_vol = ticks_df.filter(pl.col("price") >= limit_up_price)["volume"].sum()
                  total_vol = ticks_df["volume"].sum()
                  up_ratio = up_vol / (total_vol + 1e-8)
                  price_response_validity = max(0.1, 1.0 - up_ratio)
              elif min_price <= limit_down_price:
                  limit_state = 2
                  down_vol = ticks_df.filter(pl.col("price") <= limit_down_price)["volume"].sum()
                  total_vol = ticks_df["volume"].sum()
                  down_ratio = down_vol / (total_vol + 1e-8)
                  price_response_validity = max(0.1, 1.0 - down_ratio)
              return {"limit_state": limit_state, "price_response_validity": price_response_validity}
          EOF

          cat << 'EOF' > src/engine/daily_aggregator.py
          import polars as pl

          def aggregate_to_daily_row(aligned_min_df, limit_dict, auction_dict, dq_weights):
              if aligned_min_df.is_empty():
                  return pl.DataFrame()
              code = aligned_min_df["code"][0]
              date = aligned_min_df["trade_date"][0]
              daily_vol = aligned_min_df["volume_sum"].sum()
              daily_amt = aligned_min_df["volume_sum"].sum() * aligned_min_df["vwap"].mean()
              daily_ticks = aligned_min_df["trade_count"].sum()
              buy_vol_sum = aligned_min_df["buy_vol"].sum()
              sell_vol_sum = aligned_min_df["sell_vol"].sum()
              imbalance_mean = aligned_min_df["imbalance"].mean()
              imbalance_std = aligned_min_df["imbalance"].std()
              p10_val = aligned_min_df["imbalance"].quantile(0.1)
              p90_val = aligned_min_df["imbalance"].quantile(0.9)
              buy_active_mins = aligned_min_df.filter(pl.col("imbalance") > 0.3).len()
              sell_active_mins = aligned_min_df.filter(pl.col("imbalance") < -0.3).len()
              observed_ratio = aligned_min_df.filter(pl.col("has_trade")).len() / 240.0
              empty_ratio = aligned_min_df.filter(pl.col("is_empty_bin")).len() / 240.0
              dir_coverage = (buy_vol_sum + sell_vol_sum) / (daily_vol + 1e-8)
              dq_score = (
                  dq_weights.get("observed_ratio", 0.4) * observed_ratio +
                  dq_weights.get("coverage_ratio", 0.3) * dir_coverage +
                  dq_weights.get("non_empty_ratio", 0.3) * (1.0 - empty_ratio)
              )
              price_response = abs(aligned_min_df["price_return"].sum())
              buy_aggression = buy_vol_sum / (daily_vol + 1e-8)
              sell_aggression = sell_vol_sum / (daily_vol + 1e-8)
              buy_absorption_raw = buy_aggression * (1.0 - min(price_response, 1.0)) * (buy_active_mins / 240.0)
              sell_absorption_raw = sell_aggression * (1.0 - min(price_response, 1.0)) * (sell_active_mins / 240.0)
              return pl.DataFrame({
                  "code": [code], "date": [date], "total_volume": [daily_vol], "total_amount": [daily_amt],
                  "tick_count": [daily_ticks], "buy_volume_sum": [buy_vol_sum], "sell_volume_sum": [sell_vol_sum],
                  "buy_aggression": [buy_aggression], "sell_aggression": [sell_aggression],
                  "imbalance_mean": [imbalance_mean], "imbalance_std": [imbalance_std],
                  "imbalance_p10": [p10_val], "imbalance_p90": [p90_val],
                  "buy_active_minutes": [buy_active_mins], "sell_active_minutes": [sell_active_mins],
                  "price_response": [price_response],
                  "buy_absorption_raw": [buy_absorption_raw * limit_dict["price_response_validity"]],
                  "sell_absorption_raw": [sell_absorption_raw * limit_dict["price_response_validity"]],
                  "observed_minute_ratio": [observed_ratio], "empty_minute_ratio": [empty_ratio],
                  "direction_coverage_ratio": [dir_coverage], "data_quality_score": [dq_score],
                  **auction_dict, **limit_dict
              })
          EOF

          cat << 'EOF' > src/engine/behavior_scores.py
          import polars as pl

          def evaluate_behavior_scores(daily_fact_df):
              return daily_fact_df.with_columns([
                  (pl.col("buy_absorption_raw") * (1.0 - pl.col("pp_60")) * (1.0 + pl.col("rs_5").clamp(0.0, 1.0)) * pl.col("data_quality_score")).alias("accumulation_score"),
                  (pl.col("buy_aggression") * pl.col("price_response") * (1.0 + pl.col("rs_5").clamp(0.0, 1.0)) * pl.col("data_quality_score")).alias("attack_score"),
                  (pl.col("sell_absorption_raw") * (1.0 - pl.col("pp_20")) * (1.0 - pl.col("bias_20").clamp(-1.0, 0.0)) * pl.col("data_quality_score")).alias("defense_score"),
                  (pl.col("buy_absorption_raw") * pl.col("pp_60") * (1.0 - pl.col("price_response")) * pl.col("data_quality_score")).alias("distribution_score")
              ]).with_columns([
                  pl.struct([
                      "accumulation_score", "attack_score", "defense_score", "distribution_score"
                  ]).map_elements(lambda x: _determine_primary_state(x), return_dtype=pl.Struct([
                      pl.Field("primary_state", pl.String),
                      pl.Field("state_confidence", pl.Float64)
                  ]))
              ]).unnest("primary_state")

          def _determine_primary_state(scores):
              state_mapping = {
                  "ACCUMULATION": scores.get("accumulation_score", 0.0),
                  "ATTACK": scores.get("attack_score", 0.0),
                  "DEFENSE": scores.get("defense_score", 0.0),
                  "DISTRIBUTION": scores.get("distribution_score", 0.0)
              }
              best_state = "NEUTRAL"
              best_score = 0.0
              for state, val in state_mapping.items():
                  if val is not None and val > best_score:
                      best_score = val
                      best_state = state
              if best_score < 0.15:
                  best_state = "NEUTRAL"
                  best_score = 0.0
              return {"primary_state": best_state, "state_confidence": float(best_score)}
          EOF

      - name: 📝 Write Pipeline Script
        run: |
          cat << 'EOF' > src/pipeline/run_daily_pipeline.py
          import os
          import sys
          import json
          import subprocess
          import polars as pl
          import yaml
          from concurrent.futures import ThreadPoolExecutor

          sys.path.append(os.path.abspath(os.path.join(os.path.dirname(__file__), "../..")))
          from src.engine.tick_cleaner import clean_raw_ticks
          from src.engine.micro_binner import perform_micro_binning
          from src.engine.auction_features import extract_auction_features
          from src.engine.limit_regime import calculate_limit_regime
          from src.engine.daily_aggregator import aggregate_to_daily_row
          from src.engine.behavior_scores import evaluate_behavior_scores

          def load_configs():
              with open("config/settings.yaml", "r") as f:
                  settings = yaml.safe_load(f)
              with open("config/factor_config.yaml", "r") as f:
                  factors = yaml.safe_load(f)
              return settings, factors

          def compile_go_core():
              print("🛠️  正在编译 Go 核心网关...", flush=True)
              cmd = ["go", "build", "-o", "fetcher_core", "src/go_fetcher/fetcher.go"]
              res = subprocess.run(cmd, capture_output=True)
              if res.returncode != 0:
                  print(f"❌ 编译失败: {res.stderr.decode('utf-8')}", flush=True)
                  sys.exit(1)
              print("✅ 核心网关编译成功。", flush=True)

          def prepare_stock_list():
              """完美还原：直接使用编译好的 Go 引擎进行 DialDefault 自动连接与自适应测速"""
              if os.path.exists("stock_list.json"):
                  with open("stock_list.json", "r") as f:
                      return json.load(f)

              print("📋 正在调用 Go 引擎 (DialDefault 测速) 抓取全市场标的...", flush=True)
              res = subprocess.run([
                  "./fetcher_core", "-mode=list"
              ], capture_output=True, text=True)
              
              if res.returncode == 0:
                  print("✅ 成功完成全市场标的初始化。", flush=True)
                  with open("stock_list.json", "r") as f:
                      return json.load(f)
              else:
                  print(f"❌ 错误：Go 网关初始化失败: {res.stderr.strip()}", flush=True)
                  sys.exit(1)

          def run_chunk_pipeline(chunk_idx: int, codes: list, date_str: str, settings: dict, factors: dict) -> pl.DataFrame:
              csv_path = f"data/temp_chunks/chunk_{chunk_idx}.csv"
              codes_str = ",".join(codes)
              
              print(f"▶️  [分片 {chunk_idx}] 启动，调度股票数量: {len(codes)} (利用 DialDefault 自动择路)...", flush=True)
              
              # 3分钟超时阈值防卡死，由 Go 内核自动选取最佳服务器
              try:
                  res = subprocess.run([
                      "./fetcher_core", "-mode=fetch", f"-codes={codes_str}", f"-date={date_str}", f"-out={csv_path}"
                  ], capture_output=True, text=True, timeout=180)
                  
                  if res.returncode != 0:
                      print(f"[分片 {chunk_idx} 异常] Go 进程返回失败: {res.stderr}", flush=True)
                      return pl.DataFrame()
              except subprocess.TimeoutExpired:
                  print(f"[分片 {chunk_idx} 超时] 该批次任务响应超时 (180秒限额已耗尽)，强行截断。", flush=True)
                  return pl.DataFrame()
              
              if not os.path.exists(csv_path) or os.path.getsize(csv_path) < 100:
                  print(f"[分片 {chunk_idx}] 未获取到任何有效成交 facts，此分片为空。", flush=True)
                  return pl.DataFrame()

              print(f"📥 [分片 {chunk_idx}] 数据拉取完毕。启动 Polars 极速重采样与量化特征推演...", flush=True)
              raw_df = clean_raw_ticks(csv_path)
              
              if os.path.exists(csv_path):
                  os.remove(csv_path)

              results = []
              success_count = 0
              for code in codes:
                  single_ticks = raw_df.filter(pl.col("code") == code)
                  if single_ticks.is_empty():
                      continue
                  
                  prices = single_ticks["price"]
                  prev_close = float(prices[0])
                  
                  auction_features = extract_auction_features(single_ticks, prev_close)
                  limit_features = calculate_limit_regime(
                      single_ticks, prev_close, factors["limit_thresholds"]["limit_up_pct"], factors["limit_thresholds"]["limit_down_pct"]
                  )
                  aligned_bins = perform_micro_binning(
                      single_ticks, adv_1m=1000.0, atr_1m=0.01, eps_vol=float(factors["epsilon"]["vol"]), eps_res=float(factors["epsilon"]["res"])
                  )
                  if aligned_bins.is_empty():
                      continue

                  daily_fact = aggregate_to_daily_row(aligned_bins, limit_features, auction_features, factors["data_quality_weights"])
                  results.append(daily_fact)
                  success_count += 1

              print(f"⏹️  [分片 {chunk_idx}] 处理完毕。成功解析标的数量: {success_count} / {len(codes)}", flush=True)
              
              if len(results) == 0:
                  return pl.DataFrame()
              return pl.concat(results)

          def main():
              settings, factors = load_configs()
              compile_go_core()
              
              # 自建弹性种子清单
              all_stocks = prepare_stock_list()
              codes = [s["code"] for s in all_stocks]
              
              if settings.get("test_mode", False):
                  print("⚠️  当前处于 [测试运行模式]，仅计算测试样例标的。", flush=True)
                  codes = settings.get("test_stocks", ["SZ000001"])
                  
              import requests, time
              print("📡 正在获取授时中心(百度)高精真实北京时间...", flush=True)
              resp = requests.head("https://www.baidu.com")
              bj_time = time.strptime(resp.headers["Date"], "%a, %d %b %Y %H:%M:%S GMT")
              bj_timestamp = time.mktime(bj_time) + 8 * 3600
              date_str = time.strftime("%Y%m%d", time.localtime(bj_timestamp))
              
              if time.localtime(bj_timestamp).tm_wday >= 5:
                  print("☕ 今天是周末，休市暂停计算。", flush=True)
                  sys.exit(0)

              print(f"📅 本日数据结算时间: {date_str} (周{(time.localtime(bj_timestamp).tm_wday + 1)})", flush=True)
              chunk_size = settings.get("chunk_size", 500)
              chunks = [codes[i:i + chunk_size] for i in range(0, len(codes), chunk_size)]
              
              daily_results = []
              concurrency = settings.get("concurrency", 4)
              
              print(f"🔥 启动并发任务线: 并发因子 = {concurrency}，计划提取批次 = {len(chunks)} 个", flush=True)
              
              with ThreadPoolExecutor(max_workers=concurrency) as executor:
                  futures = []
                  for idx, subset in enumerate(chunks):
                      futures.append(executor.submit(run_chunk_pipeline, idx, subset, date_str, settings, factors))
                  for f in futures:
                      res_df = f.result()
                      if res_df is not None and not res_df.is_empty():
                          daily_results.append(res_df)

              if len(daily_results) == 0:
                  print("❌ 本日全市场高频清洗流程未能成功产出有效原子因子。", flush=True)
                  sys.exit(0)

              print("🧱 正在进行全市场分片原子特征物理重组与对齐...", flush=True)
              final_fact_df = pl.concat(daily_results)
              
              context_df = pl.DataFrame({
                  "code": final_fact_df["code"],
                  "pp_20": [0.3] * len(final_fact_df),
                  "pp_60": [0.4] * len(final_fact_df),
                  "bias_20": [0.01] * len(final_fact_df),
                  "rs_5": [0.02] * len(final_fact_df)
              })
              
              final_fact_df = final_fact_df.join(context_df, on="code", how="left")
              
              print("🧠 正在调制连续型机构高阶行为映射模型...", flush=True)
              output_df = evaluate_behavior_scores(final_fact_df)
              
              out_file = f"data/output/factors_{date_str}.parquet"
              output_df.write_parquet(out_file, compression="zstd")
              print(f"🏁 日级高维机构行为特征文件处理成功，并已压缩存储于: {out_file}", flush=True)

          if __name__ == "__main__":
              main()
          EOF

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          go mod init tick_fetcher || true
          go get github.com/injoyai/tdx@master
          go mod tidy

      - name: 🚀 Execute High-Performance Pipeline
        run: |
          python src/pipeline/run_daily_pipeline.py

      - name: 📤 Upload Captured Compressed Parquet Factors
        uses: actions/upload-artifact@v4
        with:
          name: tdx-high-freq-behavior-factors
          path: data/output/*.parquet
          retention-days: 7
