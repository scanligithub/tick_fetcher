name: Daily TDX Behavior Factor Pipeline

on:
  schedule:
    - cron: '30 8 * * 1-5'  # 北京时间周一至周五下午 16:30 触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          go mod init tick_fetcher || true
          go get github.com/injoyai/tdx@master
          go mod tidy

      - name: 🚀 Execute High-Performance Pipeline
        run: |
          python src/pipeline/run_daily_pipeline.py

      - name: 📤 Upload Captured Compressed Parquet Factors
        uses: actions/upload-artifact@v4
        with:
          name: tdx-high-freq-behavior-factors
          path: data/output/*.parquet
          retention-days: 7
