name: Daily TDX Behavior Factor Pipeline

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '指定调制的历史交易日 (格式: YYYYMMDD，如 20260604。留空则默认自动推导最新收盘日)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          cd src/go_fetcher
          go get github.com/injoyai/tdx@master
          go mod tidy
          
      - name: 🔍 Run Physical Sanity Check
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python src/pipeline/data_sanity_check.py

      - name: 🚀 Execute High-Performance Pipeline
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          python src/pipeline/run_daily_pipeline.py

      - name: 📊 Run Factor Distribution Audit
        run: |
          python src/pipeline/factor_audit.py

      - name: 🔬 Run Semantic State Audit (PART 0 - PART 4)
        run: |
          python src/pipeline/semantic_state_audit.py

      - name: 📈 Run Forward Alpha & Rank IC Validation
        run: |
          python src/pipeline/run_alpha_validation.py

      - name: 📤 Upload Captured Compressed Parquet Factors
        uses: actions/upload-artifact@v4
        with:
          name: tdx-high-freq-behavior-factors
          path: data/output/*.parquet
          retention-days: 7
